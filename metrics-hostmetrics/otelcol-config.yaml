receivers:
  # sample なので､otelcol のコンテナのメトリクスを送っています｡実際にはホスト側の /proc/ をマウントする必要があります｡
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/receiver/hostmetricsreceiver/README.md
  hostmetrics:
    collection_interval: 1m
    scrapers:
      cpu:
      memory:
      disk:
      filesystem:
      load:
      network:
      processes:
      system:

processors:
  # データをまとめて送る
  # https://github.com/open-telemetry/opentelemetry-collector/blob/main/processor/batchprocessor/README.md
  batch:
    timeout: 5s
    send_batch_size: 2048
    send_batch_max_size: 4096

  # resource で attribute を追加できます｡
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/processor/resourceprocessor/README.md
  resource/add_attr:
    attributes:
      - key: sample.name
        value: "my-service"
        action: insert

exporters:
  # メトリクスの exporter
  # https://github.com/sacloud/sacloud-otel-collector/blob/main/exporter/sacloudexporter/README.md
  sacloud:
    metrics:
      endpoint: "${env:SACLOUD_METRICS_ENDPOINT}"
      token: "${env:SACLOUD_METRICS_TOKEN}"


service:
  pipelines:
    metrics/hostmetrics:
      receivers:
        - hostmetrics
      processors:
        - resource/add_attr
        - batch
      exporters:
        - sacloud
